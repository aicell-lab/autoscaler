title: OME-Zarr views over existing files

# Two halves of the same claim: a local archive folder, and files that stay in
# remote object storage. Neither is converted; both are served as OME-Zarr.
sources:

  # LOCAL — everything under this folder. Populate it with `fetch_demo_data.py`,
  # or point `path` at your own archive.
  - type: local_dir
    path: ./data
    licence: CC-BY-4.0
    source_page: https://zenodo.org/records/8305531

  # REMOTE, explicit URLs — the Viv demo bucket serves range reads but denies
  # listing (403 on ?list-type=2), so its contents must be named.
  - type: remote_files
    files:
      - id: idr0106
        url: https://viv-demo.storage.googleapis.com/idr0106.pyramid.ome.tif
        title: idr0106 — human lung, 3-channel pyramid (42 GB)
        licence: CC-BY-4.0
        attribution: >-
          IDR study idr0106; hosted as Viv demo data by HMS DBMI.
        source_page: https://idr.openmicroscopy.org/webclient/?show=project-1102
      - id: spraggins-kidney
        url: https://viv-demo.storage.googleapis.com/Vanderbilt-Spraggins-Kidney-MxIF.ome.tif
        title: Human kidney, multiplexed immunofluorescence
        licence: CC-BY-4.0
        attribution: >-
          HuBMAP / Vanderbilt BIOMIC (Spraggins lab), mirrored as Viv demo data.
          Licence from the HuBMAP portal-wide CC-BY-4.0 policy; this mirror
          exposes no per-dataset licence field and no HBM id.
        source_page: https://portal.hubmapconsortium.org/
      - id: brain-pyramid
        url: https://viv-demo.storage.googleapis.com/brain.pyramid.ome.tif
        title: Brain, pyramidal OME-TIFF
        licence: unverified
        attribution: >-
          Viv demo bucket. No licence or provenance metadata is exposed for
          this file — included to exercise the catalog, NOT for publication.
        source_page: https://github.com/hms-dbmi/viv

  # REMOTE, listed from a bucket prefix. Works where the bucket allows listing;
  # logs a warning and yields nothing where it does not.
  # - type: remote_prefix
  #   url: s3://my-bucket/imaging/
  #   anonymous: true

  # AUTHENTICATION demo — same recipe, but the view refuses to answer without
  # a token. token_env fails closed: if the variable is unset the entry is
  # dropped rather than served in the open.
  - type: files
    token_env: OMEZARR_VIEW_DEMO_TOKEN
    files:
      - id: protected-mousebrain
        path: ./data/MouseBrain_41Slices_1Tile_3Channel_2Illuminations_2Angles.czi
        title: Mouse brain (access-controlled copy)
        licence: CC-BY-4.0
        attribution: >-
          Same file as the public entry, served through a token-protected view
          to demonstrate access control on a lazy OME-Zarr endpoint.
        source_page: https://zenodo.org/records/8305531
